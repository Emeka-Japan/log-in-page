<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="htpps://cdnjs.cloudflare.com/ajx/libs/font-aweosome/6.0.0/css/all.min.css">
    <title>Log-in page</title>
</head>

<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo"><i class="fa-solid fa-circle-notch"></i></div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">About</a></li>
            </ul>

            <div class="nav-right">
                <div class="search-box">
                    <i class="fa-solid fa-magnifing-glass"></i>
                    <span>Search</span>
                </div>
                <i class="fa-regular fa-user user-icon"></i>
                <i class="fa-solid fa-user gear-icon"></i>
            </div>
        </nav>
        <div class="glass-form">
            <h2>Sign Up</h2>
            <p class="subtitle">Already a member? <a href="#">Log in</a></p>
            <form>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="input-group">
                    <label>password</label>
                    <input type="password" required>
                </div>
                <button type="submit" class="signup-btn">Sign up</button>
            </form>
            <div class="divider">
                <span>or sign up with</span>
            </div>
            <div class="social-icons">
                <img src="search.png" height="15" alt="">
                <img src="download (1).png" height="15" alt="">
            </div>
        </div>
    </div>





</body>

</html>
